name: forgery-runner

on:
  workflow_dispatch:
    inputs:
      proxy_url:
        description: 'forgery public URL'
        required: true
      reg_token:
        description: 'one-time registration token'
        required: true
      labels:
        description: 'comma-separated runner labels (with :docker://...)'
        required: true
      container_image:
        description: 'default container image'
        required: false
      task_id:
        description: 'Forgejo task id (for logging)'
        required: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Download forgejo-runner
        run: |
          RUNNER_VERSION="${FORGEJO_RUNNER_VERSION:-$(curl -sSL https://code.forgejo.org/api/v1/repos/forgejo/runner/releases/latest | grep -o '"tag_name":"[^"]*"' | cut -d'"' -f4)}"
          curl -sSL "https://code.forgejo.org/forgejo/runner/releases/download/${RUNNER_VERSION}/forgejo-runner-${RUNNER_VERSION#v}-linux-amd64" \
            -o /usr/local/bin/forgejo-runner
          chmod +x /usr/local/bin/forgejo-runner

      - name: Generate runner config
        run: |
          mkdir -p /tmp/forgejo-runner
          cat > /tmp/forgejo-runner/config.yml <<EOF
          runner:
            labels:
          ${{ inputs.labels }}
          EOF

      - name: Run forgejo-runner one-job
        run: |
          forgejo-runner one-job \
            --config /tmp/forgejo-runner/config.yml \
            register \
              --name "forgery-worker-${{ inputs.task_id }}" \
              --token "${{ inputs.reg_token }}" \
              --instance "${{ inputs.proxy_url }}" \
              --ephemeral
