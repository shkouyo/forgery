name: forgery-runner

on:
  workflow_dispatch:
    inputs:
      proxy_url:
        description: 'forgery public URL'
        required: true
      reg_token:
        description: 'one-time registration token'
        required: true
      labels:
        description: 'comma-separated runner labels (with :docker://...)'
        required: true

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Download forgejo-runner
        run: |
          RUNNER_VERSION="${FORGEJO_RUNNER_VERSION:-$(curl -sSL https://code.forgejo.org/api/v1/repos/forgejo/runner/releases/latest | grep -o '"tag_name":"[^"]*"' | cut -d'"' -f4)}"
          curl -sSL "https://code.forgejo.org/forgejo/runner/releases/download/${RUNNER_VERSION}/forgejo-runner-${RUNNER_VERSION#v}-linux-amd64" \
            -o /usr/local/bin/forgejo-runner
          chmod +x /usr/local/bin/forgejo-runner

      - name: Run forgejo-runner one-job
        run: |
          mkdir -p /tmp/forgejo-runner

          # Write registration token to a file (required by --token-url)
          printf '%s' "${{ inputs.reg_token }}" > /tmp/forgejo-runner/token

          # Generate a random runner UUID
          RUNNER_UUID="$(uuidgen 2>/dev/null || cat /proc/sys/kernel/random/uuid 2>/dev/null || printf '%08x-%04x-%04x-%04x-%012x' $RANDOM $RANDOM $RANDOM $RANDOM $RANDOM)"

          # Split comma-separated labels into individual --label flags
          labels="${{ inputs.labels }}"
          label_args=()
          IFS=',' read -ra label_array <<< "$labels"
          for lbl in "${label_array[@]}"; do
            lbl="${lbl#"${lbl%%[![:space:]]*}"}"
            lbl="${lbl%"${lbl##*[![:space:]]}"}"
            [ -n "$lbl" ] && label_args+=(--label "$lbl")
          done

          forgejo-runner one-job \
            --url "${{ inputs.proxy_url }}" \
            --uuid "${RUNNER_UUID}" \
            --token-url "file:///tmp/forgejo-runner/token" \
            "${label_args[@]}" \
            --wait
